name: New AI writing tell
description: Suggest a phrase, word or pattern that slopfix should catch.
labels: [rules]
body:
  - type: input
    id: phrase
    attributes:
      label: Phrase or pattern
      placeholder: "a rich tapestry of"
    validations:
      required: true
  - type: dropdown
    id: lang
    attributes:
      label: Language
      options: [English, French, Other]
    validations:
      required: true
  - type: input
    id: replacement
    attributes:
      label: Safe replacement (optional)
      description: Only if the replacement never changes the meaning.
  - type: textarea
    id: examples
    attributes:
      label: Real examples
      description: One or two sentences where you saw it.
